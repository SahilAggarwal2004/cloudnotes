  - brace-expansion@1.1.16 || 1.1.17 || 5.0.7 || 5.0.8
  - js-yaml@4.3.0
  - dompurify@3.4.11 || 3.4.12
  - sharp@0.35.0
overrides:
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
